identifier: sparkfun_esp32_thing/esp32/procpu
name: Sparkfun ESP32 Thing PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
# SRAM1 selected by the board DTS, in KiB; shared between the CPUs.
ram: 512
supported:
  - adc
  - dac
  - gpio
  - i2c
  - i2s
  - watchdog
  - uart
  - nvs
  - pwm
  - spi
  - counter
  - entropy
  - input
  - crypto
  - retained_mem
  - netif:wifi
vendor: espressif
